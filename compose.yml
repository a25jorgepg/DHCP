services:

  router:
    build: ./docker/router
    hostname: router
    networks:
      rede_wan:
        ipv4_address: 192.168.200.254  
        interface_name: eth0  
      dhcp_lab:
        ipv4_address: 192.168.130.254
        interface_name: eth1
      rede2:
        ipv4_address: 192.168.140.254
        interface_name: eth2
  arya:
    build: docker/arya
    hostname: arya
    networks: 
      dhcp_lab:
        ipv4_address: 192.168.10.1
    volumes:
      - ./arya/named.conf.local:/etc/bind/named.conf.local
      - ./arya/zonas:/var/cache/bind/zonas          
  kea:
    build: ./docker/kea
    container_name: kea
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  cliente1:
    build: ./docker/cliente
    container_name: client1
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.221
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    cap_add:
      - NET_ADMIN

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"

  cliente2:
    build: ./docker/cliente

    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.222

    cap_add:
      - NET_ADMIN

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
      

networks:
  dhcp_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.130.0/24
  rede2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.140.0/24

  rede_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24    
  